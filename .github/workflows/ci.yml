name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run build

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # CI wants the whole failure picture; fail-fast is for local iteration.
      - run: npm run e2e:all

  # The two WASM payloads are the only things that can silently break the
  # product; once the app grows, add a budget check here (slvs ~1.6 MB gzip,
  # occt-wasm ~6.8 MB gzip).
