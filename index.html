<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>cad</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #fbfbf9;
      }
    </style>
    <script>
      (() => {
        try {
          const mode = localStorage.getItem("cad.theme") === "night" ? "night" : "day";
          const saved = localStorage.getItem("cad.highlight");
          const highlight = ["yellow", "pink", "blue", "green"].includes(saved)
            ? saved
            : "yellow";
          document.documentElement.dataset.theme = mode;
          document.documentElement.dataset.highlight = highlight;
          document.documentElement.style.backgroundColor =
            mode === "night" ? "#111110" : "#fbfbf9";
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
